[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersecurity-ml-lab"
version = "0.1.0"
description = "Reproducible cybersecurity machine learning experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["joblib>=1.3", "numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3"]

[project.scripts]
ids-train = "cybersecurity_ml.ids.train:main"
ids-ddqn = "cybersecurity_ml.ids.rl_train:main"
ids-monitor = "cybersecurity_ml.ids.monitor:main"
ids-simulate = "cybersecurity_ml.ids.simulate:main"
password-generate = "cybersecurity_ml.passwords.generate:main"
password-eda = "cybersecurity_ml.passwords.eda:main"
password-train = "cybersecurity_ml.passwords.train_classifier:main"

[tool.setuptools.packages.find]
where = ["src"]
